const lists={day:DAY,night:NIGHT};let dateKey='';let state={day:[],night:[]};const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'});function dateNow(){const p=fmt.formatToParts(new Date());const o=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}`;}function key(){return 'xime-rutinas-v1:'+dateKey;}function load(){dateKey=dateNow();try{const raw=JSON.parse(localStorage.getItem(key())||'{}');state={day:DAY.map((_,i)=>raw.day?.[i]===true),night:NIGHT.map((_,i)=>raw.night?.[i]===true)};}catch(e){state={day:DAY.map(()=>false),night:NIGHT.map(()=>false)};}document.getElementById('today').textContent=new Intl.DateTimeFormat('es-MX',{timeZone:'America/Mexico_City',weekday:'long',day:'numeric',month:'long'}).format(new Date());}function save(){try{localStorage.setItem(key(),JSON.stringify(state));return true;}catch(e){show('No se pudo guardar. Revisa el espacio disponible.');return false;}}let toastTimer;function show(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900);}function rollover(){if(dateNow()!==dateKey){load();render();show('Nuevo día, nuevas oportunidades ♡');}}function render(){for(const kind of ['day','night']){const arr=lists[kind],box=document.getElementById('list-'+kind);box.replaceChildren();arr.forEach(([time,name,detail],i)=>{const b=document.createElement('button');b.type='button';b.className='item'+(state[kind][i]?' done':'');b.setAttribute('aria-pressed',String(state[kind][i]));const c=document.createElement('span');c.className='check';c.textContent=state[kind][i]?'✓':'';c.setAttribute('aria-hidden','true');const t=document.createElement('span');const tm=document.createElement('div');tm.className='time';tm.textContent=time;const nm=document.createElement('div');nm.className='name';nm.textContent=name;t.append(tm,nm);if(detail){const d=document.createElement('div');d.className='detail';d.textContent=detail;t.append(d);}b.append(c,t);b.addEventListener('click',()=>{rollover();const before=state[kind][i];state[kind][i]=!before;if(!save()){state[kind][i]=before;return;}render();if(!before){const n=state[kind].filter(Boolean).length;if(n===arr.length)show('¡Círculo cerrado! ✨');else if(n===Math.ceil(arr.length/2))show('¡Ya vas por la mitad! 🌷');}});box.append(b);});const done=state[kind].filter(Boolean).length;document.getElementById('count-'+kind).textContent=`${done} de ${arr.length}`;document.getElementById('status-'+kind).textContent=done===arr.length?'¡Círculo cerrado! ✨':done===0?'Lista para empezar':`${arr.length-done} por hacer`;document.getElementById('fill-'+kind).style.width=(100*done/arr.length)+'%';const circumference=2*Math.PI*19;document.getElementById('ring-'+kind).setAttribute('stroke-dasharray',`${circumference*done/arr.length} ${circumference}`);document.getElementById('note-'+kind).textContent=done===arr.length?'¡Lo lograste! Disfruta este momento ♡':done>=Math.ceil(arr.length/2)?'Vas avanzando, a tu ritmo ✨':kind==='day'?'Cada paso cuenta ✨':'Tu descanso también es un logro ♡';}}document.getElementById('help').addEventListener('click',()=>alert('Toca cualquier actividad para marcarla o desmarcarla. Tus cambios se guardan automáticamente en este navegador. Al comenzar un nuevo día en León, ambas listas aparecen vacías. No borres los datos del navegador si quieres conservar el avance de hoy. Este archivo no sincroniza con otros dispositivos.'));document.getElementById('js-warning')?.remove();load();render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollover();});window.addEventListener('focus',rollover);setInterval(rollover,60000);
</script></body></html>
